<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lecture Attendance Form</title>
  <style>
    /* [Your existing CSS remains unchanged] */
    body {
      font-family: Arial, sans-serif;
      background-color: #0a0a0a;
      margin: 0;
      padding: 20px;
    }
    h2 {
      text-align: center;
      color: #f1e861;
    }
    form {
      background-color: #f1e861;
      padding: 50px;
      border-radius: 8px;
      max-width: 800px;
      border: 5px solid rgb(36, 184, 17);
      margin: auto;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    table {
      width: 100%;
      margin-top: 20px;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      border: 1px solid #ccc;
      text-align: left;
    }
    th {
      background-color: #ecf0f1;
    }
    .submit-btn, .add-btn {
      margin-top: 20px;
      background-color: #3498db;
      color: white;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      border-radius: 4px;
    }
    .submit-btn:hover, .add-btn:hover {
      background-color: #2980b9;
    }
    .remove-btn {
      background-color: #e74c3c;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      border-radius: 4px;
    }
    .remove-btn:hover {
      background-color: #c0392b;
    }
  </style>
  <script>
  // Redirect to login if not authenticated
  if (sessionStorage.getItem("loggedIn") !== "true") {
    alert("You must log in first.");
    window.location.href = "login.html";
  }
</script>

</head>
<body>

  <h2>Lecture Attendance Form</h2>

  <form id="attendanceForm" action="#" method="post">
    <!-- Lecture Details -->
    <label for="courseName">Course Name:</label>
    <input type="text" id="courseName" name="courseName" required>

    <label for="courseCode">Course Code:</label>
    <input type="text" id="courseCode" name="courseCode" required>

    <label for="lecturer">Lecturer Name:</label>
    <input type="text" id="lecturer" name="lecturer" required>

    <label for="date">Date of Lecture:</label>
    <input type="date" id="date" name="date" required>

    <label for="time">Time:</label>
    <input type="time" id="time" name="time" required>

    <label for="submissionDate">Date of Submission:</label>
    <input type="date" id="submissionDate" name="submissionDate" required>

    <!-- Attendance Table -->
    <h3>Student Attendance</h3>
    <table id="attendanceTable">
      <thead>
        <tr>
          <th>Registration No.</th>
          <th>Full Name</th>
          <th>Program</th>
          <th>Year</th>
          <th>Present</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td><input type="text" name="studentId[]" required></td>
          <td><input type="text" name="studentName[]" required></td>
          <td><input type="text" name="program[]" required></td>
          <td>
            <select name="year[]" required>
              <option value="">Select</option>
              <option value="1">Yr. 1</option>
              <option value="2">Yr. 2</option>
              <option value="3">Yr. 3</option>
              <option value="4">Yr. 4</option>
            </select>
          </td>
          <td>
            <select name="present[]" required>
              <option value="">Select</option>
              <option value="Yes">Yes</option>
              <option value="No">No</option>
            </select>
          </td>
          <td><button type="button" class="remove-btn" onclick="removeRow(this)">Remove</button></td>
        </tr>
      </tbody>
    </table>

    <label for="authorizeId">Enter Your Registration Number:</label>
      <input type="text" id="authorizedId" name="authorizedId" required> 

    <button type="button" class="add-btn" onclick="addRow()">Add Student</button>
    <button type="submit" class="submit-btn">Submit Attendance</button>
      
  </form>

 <script>
    function addRow() {
      const table = document.getElementById("attendanceTable").getElementsByTagName('tbody')[0];
      const newRow = table.rows[0].cloneNode(true);

      // Clear the values in the cloned row
      Array.from(newRow.querySelectorAll("input, select")).forEach(input => {
        input.value = "";
      });

      table.appendChild(newRow);
    }


  const authorizedId = "UG123456"; // Replace with the allowed ID

  document.getElementById("attendanceForm").addEventListener("submit", function(e) {
    const enteredId = document.getElementById("authorizedId").value.trim();
    if (enteredId !== authorizedId) {
      e.preventDefault();
      alert("You are not authorized to submit this form.");
    }
  });


    function removeRow(button) {
      const row = button.closest("tr");
      const table = document.getElementById("attendanceTable").getElementsByTagName('tbody')[0];
      if (table.rows.length > 1) {
        row.remove();
      } else {
        alert("At least one student row must remain.");
      }
    }
  </script>

</body>
</html>
