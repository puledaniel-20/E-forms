<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login to Access Attendance Form</title>
  <style>
    body {
      background-color: #0a0a0a;
      font-family: Arial, sans-serif;
      color: #f1e861;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background-color: #f1e861;
      padding: 40px;
      border-radius: 8px;
      color: #000;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 4px;
      border: 1px solid #ccc;
    }
    button {
      margin-top: 20px;
      width: 50%;
      padding: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>Login</h2>
    <input type="email" id="username" placeholder="Enter Username" required>
    <input type="password" id="password" placeholder="Enter Password" required>
    <button onclick="login()">Login</button>
  </div>

  <script>
  function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    // Replace with your own credentials
    const validUsername = "puledaniel2002@gmail.com";
    const validPassword = "0786123461";

    if (username === validUsername && password === validPassword) {
      sessionStorage.setItem("loggedIn", "true");
      window.location.href = "lectures.html"; // ✅ Redirects to lectures.html
    } else {
      alert("Invalid credentials. Access denied.");
    }
  }
</script>


</body>
</html>
